<html lang="en-GB">
    <head>
        <title>Trafford Data Lab: Resident Population of Trafford (2024)</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
        <meta charset="UTF-8"/>
        <meta name="keywords" content="population, residents, people, trafford, open, data, open data, data visualisation, visualisation"/>

        <link rel="stylesheet" href="../css/base.css"/>
        <link rel="stylesheet" href="../css/accessible_graphics.css"/>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans%7CRoboto"/>

    <body>
        <main>
            <h1>Resident Population of Trafford</h1>
            <cite>Source: Mid-2024 population statistics, Office for National Statistics.</cite>

            <figure>
                <img src="https://www.trafforddatalab.io/maps/static/output/trafford_population_2024.png" width="600" alt="Map of Trafford showing the 21 wards coloured according to their mid-2024 population estimates."/>
                <figcaption>
                    Trafford's total population in 2024 was 241,025. The wards with the highest resident populations in Trafford are Gorse Hill &amp; Cornbrook in the North of the borough with 13,301, Broadheath in the South with 13,102 and Old Trafford also in the North with 13,077 residents. Stretford &amp; Humphrey Park in the North, Davyhulme in the West and Sale Moor in Central have the next largest populations with 12,338, 11,922 and 11,868 residents respectively. The ward with the smallest population in Trafford is Hale Barns &amp; Timperley South in the South of the borough with 10,311 residents. This is followed by the Central wards of Sale Central, Ashton upon Mersey and Brooklands with 10,554, 10,600 and 10,667 people living there. The following list provides the population figures for each ward, grouped by the 4 localities within Trafford:
                    <ul>
                        <li><strong>Central:</strong> Sale Moor 11,868; Manor 11,736; Brooklands 10,667; Ashton upon Mersey 10,600; Sale Central 10,554</li>
                        <li><strong>North:</strong> Old Trafford 13,077; Stretford &amp; Humphrey Park 12,338; Gorse Hill &amp; Cornbrook 13,301; Lostock &amp; Barton 11,245; Longford 11,186</li>
                        <li><strong>South:</strong> Broadheath 13,102; Timperley North 11,794; Timperley Central 11,441; Hale 11,042; Altrincham 11,278; Bowdon 10,812; Hale Barns &amp; Timperley South 10,311</li>
                        <li><strong>West:</strong> Davyhulme 11,922; Flixton 11,144; Urmston 10,748; Bucklow-St Martins 10,859</li>
                    </ul>
                </figcaption>
            </figure>
        </main>
    </body>
</html>
